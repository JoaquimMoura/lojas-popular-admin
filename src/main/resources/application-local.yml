spring:
  application:
    name: lojas-popular-backend

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/lojasdb;AUTO_SERVER=TRUE;MODE=LEGACY;DB_CLOSE_DELAY=-1
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

security:
  jwt:
    issuer: lojas-popular-moveis
    secret: change-me-in-dev-64-bytes-minimum-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
    access-token:
      ttl-seconds: 3600
    refresh-token:
      ttl-seconds: 604800

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:5174
    - http://localhost:5175
    - http://localhost:5176
    - http://localhost:5177
    - http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

  mail:
    host: smtp.gmail.com
    port: 587
    username: lojas.popular@gmail.com
    password: sua-senha-ou-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# === Integrações locais ===
rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

whatsapp:
  provider: zenvia
  base-url: https://api.zenvia.com/v2/channels/whatsapp/messages
  api-key: TEST-LOCAL-ZENVIA-KEY-123456789
  remetente: Lojas Popular Moveis (DEV)

mercadopago:
  access-token: TEST-LOCAL-TOKEN-1234567890
  base-url: https://api.mercadopago.com
  webhook:
    secret: TEST-LOCAL-WEBHOOK-123
