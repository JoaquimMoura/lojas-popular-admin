<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirmação de Pedido - Lojas Popular Móveis</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 30px;
    }
    h2 {
      color: #c62828;
      text-align: center;
    }
    .detalhes {
      margin-top: 20px;
      line-height: 1.6;
    }
    .total {
      font-size: 18px;
      font-weight: bold;
      color: #2e7d32;
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
      color: #777;
    }
    .logo {
      display: block;
      margin: 0 auto 20px;
      max-width: 150px;
    }
    .button {
      display: inline-block;
      background-color: #c62828;
      color: #fff;
      padding: 12px 24px;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 25px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://lojaspopular.com.br/logo.png" alt="Lojas Popular Móveis" class="logo">
    <h2>Confirmação do seu pedido</h2>
    <p>Olá, <strong th:text="${nomeCliente}">Cliente</strong>!</p>

    <div class="detalhes">
      <p>Seu pedido <strong>#<span th:text="${numeroPedido}">0001</span></strong> foi recebido com sucesso.</p>
      <p><strong>Data do Pedido:</strong> <span th:text="${dataPedido}">22/10/2025</span></p>
      <p><strong>Status:</strong> <span th:text="${status}">Aguardando Pagamento</span></p>
      <p class="total">Total: R$ <span th:text="${total}">3799,80</span></p>

      <div th:if="${linkPagamento}">
        <a th:href="${linkPagamento}" class="button">Pagar Agora</a>
      </div>
    </div>

    <div class="footer">
      <p>Obrigado por comprar com a <strong>Lojas Popular Móveis</strong>!</p>
      <p>Este é um e-mail automático. Por favor, não responda.</p>
    </div>
  </div>
</body>
</html>
