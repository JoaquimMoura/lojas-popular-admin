spring:
  application:
    name: lojas-popular-backend

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: public

  # RabbitMQ desligado por enquanto (notificação WhatsApp inativa) — evita
  # tentativa de conexão/retry e o log repetido de "Connection refused".
  rabbitmq:
    listener:
      simple:
        auto-startup: false

server:
  port: ${PROD_SERVER_PORT:8080}

app:
  # Raiz onde as imagens (produtos por categoria, categorias, etc.) são gravadas.
  # Em produção o container roda com WORKDIR /app, então o default "uploads"
  # já resolve para /app/uploads — o mesmo caminho montado no docker-compose.prod.yml.
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ERROR

security:
  jwt:
    issuer: lojas-popular-moveis
    secret: ${JWT_SECRET}
    access-token:
      ttl-seconds: 3600
    refresh-token:
      ttl-seconds: 604800

cors:
  allowed-origins:
    - ${CORS_ORIGINS:https://popularmoveis.app.br}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"

rabbitmq:
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USER}
  password: ${RABBITMQ_PASSWORD}

whatsapp:
  provider: zenvia
  base-url: https://api.zenvia.com/v2/channels/whatsapp/messages
  api-key: ${WHATSAPP_API_KEY}
  remetente: Lojas Popular Moveis

mercadopago:
  access-token: ${MP_ACCESS_TOKEN}
  base-url: https://api.mercadopago.com
  webhook:
    secret: ${MP_WEBHOOK_SECRET}
